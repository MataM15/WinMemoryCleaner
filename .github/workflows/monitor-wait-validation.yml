name: Monitor Wait Validation

on:
  push:
    branches:
      - fix/busy-spin
    paths:
      - 'src/**'
      - '.github/workflows/monitor-wait-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  monitor-wait-validation:
    name: Focused monitor wait validation
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore locked NuGet packages
        shell: pwsh
        run: nuget restore src\WinMemoryCleaner.sln -LockedMode

      - name: Build release solution
        shell: pwsh
        run: msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:CI=true

      - name: Run focused monitor wait tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = 'WinMemoryCleaner.Test.ViewModelTests+MainViewModelMonitorWaitTests'
          $testAssembly = 'src\bin\Release\WinMemoryCleaner.exe'
          $testRunner = 'src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe'
          $resultsPath = 'monitor-wait-results.xml'
          $expectedTests = @(
            "$fixture.GetMonitorWaitMilliseconds_WhenBusy_UsesBoundedBackoffForBothMonitors",
            "$fixture.GetMonitorWaitMilliseconds_WhenNotBusy_PreservesNormalPollingIntervals",
            "$fixture.WaitForMonitor_WhenBusyAndNotCancelled_WaitsForBackoffAndReturnsFalse",
            "$fixture.WaitForMonitor_WhenCancellationRequested_ReturnsWithoutWaiting",
            "$fixture.WaitForMonitor_WhenCancelledDuringNormalWait_ReturnsCancellation"
          )

          if (-not (Test-Path $testRunner)) {
            throw "NUnit runner was not restored at $testRunner"
          }

          & $testRunner $testAssembly "/fixture:$fixture" "/xml:$resultsPath"
          $testExitCode = $LASTEXITCODE

          if (-not (Test-Path $resultsPath)) {
            throw "NUnit did not write $resultsPath"
          }

          [xml]$results = Get-Content -Raw $resultsPath
          $testCases = @($results.SelectNodes('//test-case'))
          if ($testCases.Count -ne 5) {
            throw "Expected exactly 5 focused test cases, found $($testCases.Count)"
          }

          $actualNames = @($testCases | ForEach-Object { $_.name })
          if (@(Compare-Object -ReferenceObject $expectedTests -DifferenceObject $actualNames).Count -ne 0) {
            throw 'NUnit XML did not contain exactly the expected focused test cases'
          }

          $nonPassingCases = @($testCases | Where-Object {
            $_.executed -ne 'True' -or $_.result -ne 'Success' -or $_.success -ne 'True'
          })
          if ($nonPassingCases.Count -ne 0) {
            throw "Focused NUnit XML contains non-passing tests: $($nonPassingCases.name -join ', ')"
          }

          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Run focused security policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = 'WinMemoryCleaner.Test.SecurityPolicyTests'
          $testAssembly = 'src\bin\Release\WinMemoryCleaner.exe'
          $testRunner = 'src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe'
          $resultsPath = 'security-policy-results.xml'
          $expectedTests = @(
            "$fixture.AutoUpdate_IsBlocked_WhenStoredPreferenceIsEnabled",
            "$fixture.AutoUpdate_IsBlocked_WhenStoredPreferenceIsDisabled"
          )

          if (-not (Test-Path $testRunner)) {
            throw "NUnit runner was not restored at $testRunner"
          }

          & $testRunner $testAssembly "/fixture:$fixture" "/xml:$resultsPath"
          $testExitCode = $LASTEXITCODE

          if (-not (Test-Path $resultsPath)) {
            throw "NUnit did not write $resultsPath"
          }

          [xml]$results = Get-Content -Raw $resultsPath
          $testCases = @($results.SelectNodes('//test-case'))
          if ($testCases.Count -ne 2) {
            throw "Expected exactly 2 focused test cases, found $($testCases.Count)"
          }

          $actualNames = @($testCases | ForEach-Object { $_.name })
          if (@(Compare-Object -ReferenceObject $expectedTests -DifferenceObject $actualNames).Count -ne 0) {
            throw 'NUnit XML did not contain exactly the expected security policy test cases'
          }

          $nonPassingCases = @($testCases | Where-Object {
            $_.executed -ne 'True' -or $_.result -ne 'Success' -or $_.success -ne 'True'
          })
          if ($nonPassingCases.Count -ne 0) {
            throw "Focused NUnit XML contains non-passing tests: $($nonPassingCases.name -join ', ')"
          }

          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Stage experimental Windows artifact from green build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:RUNNER_TEMP "winmemorycleaner-test-$env:GITHUB_SHA"
          $payloadFiles = @(
            [pscustomobject]@{ Source = 'src\bin\Release\WinMemoryCleaner.exe'; Destination = 'WinMemoryCleaner.exe'; Required = $true }
            [pscustomobject]@{ Source = 'src\bin\Release\nunit.framework.dll'; Destination = 'nunit.framework.dll'; Required = $true }
            [pscustomobject]@{ Source = 'src\bin\Release\WinMemoryCleaner.exe.config'; Destination = 'WinMemoryCleaner.exe.config'; Required = $false }
            [pscustomobject]@{ Source = 'LICENSE'; Destination = 'LICENSE'; Required = $true }
          )
          $requiredPayload = @('WinMemoryCleaner.exe', 'nunit.framework.dll', 'LICENSE', 'BUILD-INFO.txt')
          $allowedPayload = @('WinMemoryCleaner.exe', 'nunit.framework.dll', 'WinMemoryCleaner.exe.config', 'LICENSE', 'BUILD-INFO.txt', 'SHA256SUMS.txt')

          if (Test-Path -LiteralPath $stageRoot) {
            throw "Refusing to reuse existing artifact staging directory: $stageRoot"
          }
          New-Item -ItemType Directory -Path $stageRoot -ErrorAction Stop | Out-Null

          foreach ($payloadFile in $payloadFiles) {
            if ($payloadFile.Destination -ne [System.IO.Path]::GetFileName($payloadFile.Destination)) {
              throw "Artifact destination must be a file name: $($payloadFile.Destination)"
            }
            if (-not (Test-Path -LiteralPath $payloadFile.Source -PathType Leaf)) {
              if ($payloadFile.Required) {
                throw "Required artifact file was not produced by the green build: $($payloadFile.Source)"
              }
              continue
            }
            Copy-Item -LiteralPath $payloadFile.Source -Destination (Join-Path $stageRoot $payloadFile.Destination) -ErrorAction Stop
          }

          $buildInfo = @"
          WinMemoryCleaner experimental CI build
          Repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA

          This is an experimental, unofficial build. No Authenticode signature is expected.
          Launch: On Windows with .NET Framework 4.0 or later, run WinMemoryCleaner.exe.
          "@
          $buildInfo = $buildInfo.Trim() + [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $stageRoot 'BUILD-INFO.txt'), $buildInfo, [System.Text.UTF8Encoding]::new($false))

          $missingPayload = @($requiredPayload | Where-Object { -not (Test-Path -LiteralPath (Join-Path $stageRoot $_) -PathType Leaf) })
          if ($missingPayload.Count -ne 0) {
            throw "Artifact staging is missing required files: $($missingPayload -join ', ')"
          }
          $unexpectedPayload = @(Get-ChildItem -LiteralPath $stageRoot -File | Where-Object { $_.Name -notin $allowedPayload })
          if ($unexpectedPayload.Count -ne 0) {
            throw "Artifact staging contains unexpected files: $($unexpectedPayload.Name -join ', ')"
          }

          $checksumLines = @(Get-ChildItem -LiteralPath $stageRoot -File |
            Sort-Object Name |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash.ToLowerInvariant(), $_.Name })
          [System.IO.File]::WriteAllLines((Join-Path $stageRoot 'SHA256SUMS.txt'), $checksumLines, [System.Text.UTF8Encoding]::new($false))

          Get-ChildItem -LiteralPath $stageRoot -File | ForEach-Object { $_.IsReadOnly = $true }

      - name: Check mutation sensitivity after green validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = 'WinMemoryCleaner.Test.ViewModelTests+MainViewModelMonitorWaitTests'
          $testAssembly = 'src\bin\Release\WinMemoryCleaner.exe'
          $testRunner = 'src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe'
          $sourcePath = 'src\ViewModel\MainViewModel.cs'
          $mutationResultsPath = 'monitor-wait-mutation-results.xml'
          $busyInvariantTest = "$fixture.GetMonitorWaitMilliseconds_WhenBusy_UsesBoundedBackoffForBothMonitors"
          $busyElapsedTest = "$fixture.WaitForMonitor_WhenBusyAndNotCancelled_WaitsForBackoffAndReturnsFalse"
          $expectedTests = @(
            $busyInvariantTest,
            "$fixture.GetMonitorWaitMilliseconds_WhenNotBusy_PreservesNormalPollingIntervals",
            $busyElapsedTest,
            "$fixture.WaitForMonitor_WhenCancellationRequested_ReturnsWithoutWaiting",
            "$fixture.WaitForMonitor_WhenCancelledDuringNormalWait_ReturnsCancellation"
          )
          $expectedFailureTests = @($busyInvariantTest, $busyElapsedTest)

          if (-not (Test-Path $testRunner)) {
            throw "NUnit runner was not restored at $testRunner"
          }

          $originalBytes = [System.IO.File]::ReadAllBytes($sourcePath)
          $originalSource = [System.Text.Encoding]::UTF8.GetString($originalBytes)
          $match = 'internal const int BusyMonitorWaitMilliseconds = 100;'
          if ([regex]::Matches($originalSource, [regex]::Escape($match)).Count -ne 1) {
            throw 'Expected exactly one BusyMonitorWaitMilliseconds = 100 constant before mutation'
          }

          $mutationFailure = $null
          $restoreBuildExitCode = $null
          try {
            $mutatedSource = $originalSource.Replace($match, 'internal const int BusyMonitorWaitMilliseconds = 0;')
            [System.IO.File]::WriteAllText($sourcePath, $mutatedSource, [System.Text.UTF8Encoding]::new($false))

            & msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:CI=true
            if ($LASTEXITCODE -ne 0) {
              throw "Mutated source build failed with exit code $LASTEXITCODE"
            }

            & $testRunner $testAssembly "/fixture:$fixture" "/xml:$mutationResultsPath"
            $mutationTestExitCode = $LASTEXITCODE
            if ($mutationTestExitCode -eq 0) {
              throw 'Mutated focused tests unexpectedly returned a zero exit code'
            }
            if (-not (Test-Path $mutationResultsPath)) {
              throw "NUnit did not write $mutationResultsPath for the mutation run"
            }

            [xml]$mutationResults = Get-Content -Raw $mutationResultsPath
            $mutationCases = @($mutationResults.SelectNodes('//test-case'))
            if ($mutationCases.Count -ne 5) {
              throw "Expected exactly 5 mutation test cases, found $($mutationCases.Count)"
            }

            $actualNames = @($mutationCases | ForEach-Object { $_.name })
            if (@(Compare-Object -ReferenceObject $expectedTests -DifferenceObject $actualNames).Count -ne 0) {
              throw 'Mutation NUnit XML did not contain exactly the expected focused test cases'
            }

            $actualFailureNames = @($mutationCases | Where-Object {
              $_.executed -eq 'True' -and $_.result -eq 'Failure' -and $_.success -eq 'False'
            } | ForEach-Object { $_.name })
            if (@(Compare-Object -ReferenceObject $expectedFailureTests -DifferenceObject $actualFailureNames).Count -ne 0) {
              throw "Mutation did not fail exactly the busy invariant and elapsed-wait tests: $($actualFailureNames -join ', ')"
            }

            $unexpectedCases = @($mutationCases | Where-Object {
              $_.executed -ne 'True' -or ($_.name -notin $expectedFailureTests -and ($_.result -ne 'Success' -or $_.success -ne 'True'))
            })
            if ($unexpectedCases.Count -ne 0) {
              throw "Mutation NUnit XML contains unexpected non-passing tests: $($unexpectedCases.name -join ', ')"
            }

            Write-Host 'Mutation sensitivity confirmed: the busy invariant and elapsed-wait tests failed as expected.'
          }
          catch {
            $mutationFailure = $_
          }
          finally {
            [System.IO.File]::WriteAllBytes($sourcePath, $originalBytes)
            & msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:CI=true
            $restoreBuildExitCode = $LASTEXITCODE
          }

          if ($restoreBuildExitCode -ne 0) {
            throw "Original source rebuild after mutation failed with exit code $restoreBuildExitCode"
          }
          if ($null -ne $mutationFailure) {
            throw $mutationFailure
          }

      - name: Upload experimental Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmemorycleaner-test-${{ github.sha }}
          path: ${{ runner.temp }}\winmemorycleaner-test-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload focused NUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-wait-results-${{ github.run_number }}
          path: |
            monitor-wait-results.xml
            monitor-wait-mutation-results.xml
            security-policy-results.xml
          if-no-files-found: warn
          retention-days: 7
