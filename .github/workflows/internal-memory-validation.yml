name: Internal Memory Validation

on:
  push:
    branches:
      - test/internal-memory-improvements
    paths:
      - 'src/App.xaml.cs'
      - 'src/Core/AutoOptimizationPolicy.cs'
      - 'src/Core/Constants.cs'
      - 'src/Core/OptimizationTiming.cs'
      - 'src/Interop/NativeMethods.cs'
      - 'src/Service/ComputerService.cs'
      - 'src/Test/AutoOptimizationPolicyTests.cs'
      - 'src/Test/NativeMemoryInteropTests.cs'
      - 'src/ViewModel/MainViewModel.cs'
      - 'src/WindowsService/WinService.cs'
      - 'src/Test/ReleaseMemoryTests.cs'
      - 'src/Test/ReleaseMemoryBenchmarkTests.cs'
      - 'src/WinMemoryCleaner.csproj'
      - '.github/scripts/measure-release-memory.ps1'
      - '.github/scripts/verify-auto-policy-mutation.ps1'
      - '.github/workflows/internal-memory-validation.yml'
      - 'docs/release-memory-benchmark.md'
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: 'Run the disposable own-process ReleaseMemory benchmark'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  internal-memory-validation:
    name: Focused native memory regression validation
    runs-on: windows-2022
    timeout-minutes: 10
    if: >-
      ${{ github.repository == 'MataM15/WinMemoryCleaner' && github.ref == 'refs/heads/test/internal-memory-improvements' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore locked NuGet packages
        shell: pwsh
        run: nuget restore src\WinMemoryCleaner.sln -LockedMode

      - name: Build release solution without host mutation
        shell: pwsh
        run: msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:IsCI=true "/p:RestartFlag=$env:GITHUB_WORKSPACE\ci-restart-required.flag"

      - name: Run explicit safe fixture allowlists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testAssembly = 'src\bin\Release\WinMemoryCleaner.exe'
          $testRunner = 'src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe'

          if (-not (Test-Path $testRunner)) {
            throw "NUnit runner was not restored at $testRunner"
          }

          function Invoke-SafeFixture {
            param(
              [string]$Fixture,
              [string]$ResultsPath,
              [string[]]$ExpectedTests
            )

            & $testRunner $testAssembly "/fixture:$Fixture" "/xml:$ResultsPath"
            $testExitCode = $LASTEXITCODE

            if (-not (Test-Path $ResultsPath)) {
              throw "NUnit did not write $ResultsPath"
            }

            [xml]$results = Get-Content -Raw $ResultsPath
            $testCases = @($results.SelectNodes('//test-case'))
            if ($testCases.Count -ne $ExpectedTests.Count) {
              throw "Expected $($ExpectedTests.Count) safe test cases, found $($testCases.Count)"
            }

            $actualNames = @($testCases | ForEach-Object { $_.name })
            if (@(Compare-Object -ReferenceObject $ExpectedTests -DifferenceObject $actualNames).Count -ne 0) {
              throw 'NUnit XML did not contain exactly the safe fixture allowlist'
            }

            $nonPassingCases = @($testCases | Where-Object {
              $_.executed -ne 'True' -or $_.result -ne 'Success' -or $_.success -ne 'True'
            })
            if ($nonPassingCases.Count -ne 0) {
              throw "Safe fixture contains non-passing tests: $($nonPassingCases.name -join ', ')"
            }

            if ($testExitCode -ne 0) {
              exit $testExitCode
            }
          }

          $nativeFixture = 'WinMemoryCleaner.NativeMemoryTests.NativeMemoryInteropTests'
          Invoke-SafeFixture $nativeFixture 'native-memory-results.xml' @(
            "$nativeFixture.CreateNtStatusException_WhenStatusIsAccessDenied_MapsToWin32AccessDenied",
            "$nativeFixture.CreateNtStatusException_WhenStatusIsInvalidParameter_MapsWithoutStaleWin32Error",
            "$nativeFixture.IsAdjustTokenPrivilegesSuccessful_WhenNativeCallAndLastErrorSucceed_ReturnsTrue",
            "$nativeFixture.IsAdjustTokenPrivilegesSuccessful_WhenNotAllPrivilegesAreAssigned_ReturnsFalse",
            "$nativeFixture.IsAdjustTokenPrivilegesSuccessful_WhenNativeCallSucceedsWithError_ReturnsFalse",
            "$nativeFixture.IsAdjustTokenPrivilegesSuccessful_WhenNativeCallFailsWithSuccessError_ReturnsFalse",
            "$nativeFixture.IsAdjustTokenPrivilegesSuccessful_WhenNativeCallFailsWithError_ReturnsFalse"
          )

          $releaseMemoryFixture = 'WinMemoryCleaner.MemoryReleaseTests.ReleaseMemoryTests'
          Invoke-SafeFixture $releaseMemoryFixture 'release-memory-results.xml' @(
            "$releaseMemoryFixture.ReleaseMemory_WhenModeIsNone_DoesNotRunCleanupStages",
            "$releaseMemoryFixture.ReleaseMemory_WhenModeIsGCOnly_RunsOnlyGarbageCollection",
            "$releaseMemoryFixture.ReleaseMemory_WhenModeIsTrimOnly_RunsOnlyWorkingSetTrim",
            "$releaseMemoryFixture.ReleaseMemory_WhenModeIsCombined_RunsBothCleanupStages",
            "$releaseMemoryFixture.ReleaseMemory_WhenCombined_RunsGarbageCollectionBeforeWorkingSetTrim",
            "$releaseMemoryFixture.ReleaseMemory_WhenGarbageCollectionThrows_StillRunsWorkingSetTrim",
            "$releaseMemoryFixture.ReleaseMemory_WhenWorkingSetTrimThrows_DoesNotPreventGarbageCollection",
            "$releaseMemoryFixture.OptimizeTiming_WhenFinalAppReleaseRuns_IncludesItInTotalDuration",
            "$releaseMemoryFixture.OptimizeTiming_WhenNativeStageFailsAndOverheadRuns_IncludesAllElapsedTime",
            "$releaseMemoryFixture.OptimizeTiming_WhenFinalAppReleaseThrows_CapturesItsDuration"
          )

          $autoPolicyFixture = 'WinMemoryCleaner.AutomationTests.AutoOptimizationPolicyTests'
          Invoke-SafeFixture $autoPolicyFixture 'auto-policy-results.xml' @(
            "$autoPolicyFixture.DisabledBoth_ReturnsNull",
            "$autoPolicyFixture.Schedule_WhenJustBeforeDue_ReturnsNull",
            "$autoPolicyFixture.Schedule_WhenExactlyDue_ReturnsSchedule",
            "$autoPolicyFixture.LowMemory_WhenFreePercentageIsBelowThreshold_ReturnsLowMemory",
            "$autoPolicyFixture.LowMemory_WhenFreePercentageEqualsThreshold_ReturnsNull",
            "$autoPolicyFixture.LowMemory_WhenCooldownIsJustBeforeDue_ReturnsNull",
            "$autoPolicyFixture.LowMemory_WhenCooldownIsExactlyDue_ReturnsLowMemory",
            "$autoPolicyFixture.Schedule_WhenBothTriggersAreDue_ReturnsSchedule",
            "$autoPolicyFixture.Schedule_WhenNonZeroIntervalCrossesDateBoundary_ReturnsSchedule"
          )

      - name: Prove auto optimization policy fixture detects a threshold mutant
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\verify-auto-policy-mutation.ps1" `
            -Workspace $env:GITHUB_WORKSPACE `
            -SolutionPath "$env:GITHUB_WORKSPACE\src\WinMemoryCleaner.sln" `
            -TestAssembly "$env:GITHUB_WORKSPACE\src\bin\Release\WinMemoryCleaner.exe" `
            -TestRunner "$env:GITHUB_WORKSPACE\src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe"

      - name: Stage experimental portable Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:RUNNER_TEMP "winmemorycleaner-internal-memory-test-$env:GITHUB_SHA"
          $payloadFiles = @(
            [pscustomobject]@{ Source = 'src\bin\Release\WinMemoryCleaner.exe'; Destination = 'WinMemoryCleaner.exe'; Required = $true }
            [pscustomobject]@{ Source = 'src\bin\Release\nunit.framework.dll'; Destination = 'nunit.framework.dll'; Required = $true }
            [pscustomobject]@{ Source = 'src\bin\Release\WinMemoryCleaner.exe.config'; Destination = 'WinMemoryCleaner.exe.config'; Required = $false }
            [pscustomobject]@{ Source = 'LICENSE'; Destination = 'LICENSE'; Required = $true }
          )
          $requiredPayload = @('WinMemoryCleaner.exe', 'nunit.framework.dll', 'LICENSE', 'BUILD-INFO.txt')
          $allowedPayload = @('WinMemoryCleaner.exe', 'nunit.framework.dll', 'WinMemoryCleaner.exe.config', 'LICENSE', 'BUILD-INFO.txt', 'SHA256SUMS.txt')

          if (Test-Path -LiteralPath $stageRoot) {
            throw "Refusing to reuse existing artifact staging directory: $stageRoot"
          }
          New-Item -ItemType Directory -Path $stageRoot -ErrorAction Stop | Out-Null

          foreach ($payloadFile in $payloadFiles) {
            if (-not (Test-Path -LiteralPath $payloadFile.Source -PathType Leaf)) {
              if ($payloadFile.Required) {
                throw "Required artifact file was not produced by the green build: $($payloadFile.Source)"
              }
              continue
            }
            Copy-Item -LiteralPath $payloadFile.Source -Destination (Join-Path $stageRoot $payloadFile.Destination) -ErrorAction Stop
          }

          $buildInfo = @"
          WinMemoryCleaner experimental CI build
          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          This is an experimental, unofficial, unsigned build. No Authenticode signature is present.
          Portable use: extract all files to one folder and keep nunit.framework.dll next to WinMemoryCleaner.exe.
          Run as administrator on Windows with .NET Framework 4.0 or later.
          Persisted automatic optimization settings may still apply.
          "@
          $buildInfo = $buildInfo.Trim() + [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $stageRoot 'BUILD-INFO.txt'), $buildInfo, [System.Text.UTF8Encoding]::new($false))

          $missingPayload = @($requiredPayload | Where-Object { -not (Test-Path -LiteralPath (Join-Path $stageRoot $_) -PathType Leaf) })
          if ($missingPayload.Count -ne 0) {
            throw "Artifact staging is missing required files: $($missingPayload -join ', ')"
          }
          $unexpectedPayload = @(Get-ChildItem -LiteralPath $stageRoot -File | Where-Object { $_.Name -notin $allowedPayload })
          if ($unexpectedPayload.Count -ne 0) {
            throw "Artifact staging contains unexpected files: $($unexpectedPayload.Name -join ', ')"
          }

          $checksumLines = @(Get-ChildItem -LiteralPath $stageRoot -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash.ToLowerInvariant(), [System.IO.Path]::GetFileName($_.Path) })
          [System.IO.File]::WriteAllLines((Join-Path $stageRoot 'SHA256SUMS.txt'), $checksumLines, [System.Text.UTF8Encoding]::new($false))

      - name: Upload experimental portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmemorycleaner-internal-memory-test-${{ github.sha }}
          path: ${{ runner.temp }}\winmemorycleaner-internal-memory-test-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload focused NUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-results-${{ github.run_number }}
          path: |
            native-memory-results.xml
            release-memory-results.xml
            auto-policy-results.xml
            auto-policy-mutation-results.xml
            auto-policy-restored-results.xml
          if-no-files-found: warn
          retention-days: 7

  release-memory-benchmark:
    name: Opt-in own-process ReleaseMemory benchmark
    needs: internal-memory-validation
    if: >-
      ${{ github.repository == 'MataM15/WinMemoryCleaner' && github.ref == 'refs/heads/test/internal-memory-improvements' && ((github.event_name == 'workflow_dispatch' && inputs.run_benchmark) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]'))) }}
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore locked NuGet packages
        shell: pwsh
        run: nuget restore src\WinMemoryCleaner.sln -LockedMode

      - name: Build release solution without host mutation
        shell: pwsh
        run: msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:IsCI=true "/p:RestartFlag=$env:GITHUB_WORKSPACE\ci-restart-required.flag"

      - name: Run isolated release-memory benchmark
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\measure-release-memory.ps1" `
            -TestAssembly "$env:GITHUB_WORKSPACE\src\bin\Release\WinMemoryCleaner.exe" `
            -TestRunner "$env:GITHUB_WORKSPACE\src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\benchmark-output" `
            -Blocks 3 `
            -Samples 10 `
            -Seed 20240517

      - name: Upload release-memory benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-memory-benchmark-${{ github.run_number }}
          path: benchmark-output
          if-no-files-found: warn
          retention-days: 7
